timezone: Asia/Singapore

server:
  address: 127.0.0.1:8080
  public_url: http://127.0.0.1:8080

database:
  # Use driver: mysql with MYSQL_ADDRESS, MYSQL_USERNAME, MYSQL_PASSWORD,
  # and MYSQL_DATABASE in a cloud deployment.
  driver: sqlite
  path: cronpilot.db

log:
  format: text
  level: info

# Aliyun DirectMail uses an SMTP account and SMTP password. Keep both secrets
# in environment variables; do not put them in this file.
# email:
#   host: smtpdm.aliyun.com
#   port: 465
#   username_env: CRONPILOT_SMTP_USERNAME
#   password_env: CRONPILOT_SMTP_PASSWORD
#   from: cronpilot@example.com
#   tls: implicit
#   timeout: 20s

llm:
  base_url: https://api.openai.com/v1
  model: gpt-5
  # Prefer the CRONPILOT_API_KEY environment variable.
  api_key: ""

# Optional fallback. Adding GEMINI_API_KEY automatically enables it.
gemini:
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  model: gemini-2.5-flash-lite
  api_key: ""

# Optional narrow Cloudflare Worker relay. Prefer environment variables
# CRONPILOT_RELAY_URL and CRONPILOT_RELAY_KEY in hosted environments.
# When configured, it carries Tavily and Gemini traffic while DeepSeek remains direct.
relay:
  url: ""
  api_key: ""

# Adding TAVILY_API_KEY to the environment automatically enables Tavily even
# when this section is disabled. Never commit the key to this file.
web_search:
  enabled: false
  provider: tavily
  endpoint: https://api.tavily.com
  api_key_env: TAVILY_API_KEY
  timeout: 15s
  max_results: 12
  max_content_chars: 18000
  max_tool_rounds: 4

tasks:
  - name: daily-ai-brief
    # CronPilot applies the top-level timezone when this is omitted.
    schedule: "0 8 * * *"
    timeout: 5m
    retry:
      max_attempts: 3
      delay: 10s
    # delivery:
    #   type: email
    #   to:
    #     - you@example.com
    #   on: [success, failed, timeout]
    #   include_output: true
    prompt: |
      Summarize the most important AI developments from the last 24 hours.
      Keep the result concise and structured.

  - name: evening-review
    schedule: "0 21 * * *"
    enabled: false
    prompt: |
      Produce a short end-of-day review.
