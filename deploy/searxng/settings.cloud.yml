use_default_settings:
  engines:
    # Weixin Cloud runs on a mainland network. Load only engines that are
    # intentionally configured for that network so newly added SearXNG
    # defaults cannot silently reintroduce unreachable overseas providers.
    keep_only:
      - 360search
      - baidu
      - bing
      - bing news
      - sogou
      - sogou wechat

general:
  instance_name: CronPilot Search
  debug: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: auto
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "cronpilot-cloud-websearch-9c7a9cd8180c45f38e8be604bbd8e994"
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  pool_connections: 50
  pool_maxsize: 20

# These engines are disabled in SearXNG defaults. Enable the providers kept by
# the whitelist above and give them explicit cloud-friendly timeouts.
engines:
  - name: 360search
    disabled: false
    categories: [general, news]
    timeout: 15.0
  - name: baidu
    disabled: false
    categories: [general, news]
    timeout: 15.0
  - name: bing
    disabled: false
    categories: [general, news]
    base_url: https://cn.bing.com
    timeout: 15.0
  - name: bing news
    disabled: false
    base_url: https://cn.bing.com
    timeout: 15.0
  - name: sogou
    disabled: false
    categories: [general, news]
    timeout: 15.0
  - name: sogou wechat
    disabled: false
    timeout: 15.0
