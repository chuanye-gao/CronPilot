name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: cronpilot-ci-password
          MYSQL_DATABASE: cronpilot_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcronpilot-ci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Check and build frontend
        working-directory: web
        run: |
          pnpm run typecheck
          pnpm run build

      - name: Verify modules
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet and test backend
        env:
          CRONPILOT_MYSQL_TEST: "1"
          MYSQL_ADDRESS: 127.0.0.1:3306
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: cronpilot-ci-password
          MYSQL_DATABASE: cronpilot_ci
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Build production container
        run: docker build --tag cronpilot:ci .
